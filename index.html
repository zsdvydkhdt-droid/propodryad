 const T=[["dash","Dashboard"],["leads","Заявки"],["price","Цены"],["pros","Подрядчики"],["revs","Отзывы"]];
 let b="";
 if(TAB=="dash")b=`<div class="grid"><div class="card"><b>${leads.length}</b><div class="mu">Заявок</div></div><div class="card"><b>${(Cn.data||[]).length}</b><div class="mu">Подрядчиков</div></div><div class="card"><b>${live.length}</b><div class="mu">Продано лидов</div></div><div class="card"><b>${rev.toLocaleString("ru")} ₽</b><div class="mu">Выручка</div></div><div class="card"><b>${leads.length?Math.round(live.length/leads.length*100):0}%</b><div class="mu">Конверсия</div></div><div class="card"><b>${live.length?Math.round(rev/live.length):0} ₽</b><div class="mu">Средний чек</div></div></div><h3>По категориям</h3>${bars(by(l=>cn(l.category)))}<h3>По регионам</h3>${bars(by(l=>rn(l.region)))}`;
 if(TAB=="leads")b=`<div class="sc"><table>${leads.map(l=>`<tr><td>№${l.id}</td><td>${cn(l.category)}, ${rn(l.region)}<br><span class="mu">${l.area_m2} м² · ${esc(l.budget)} · подобрано ${l.lead_matches.length}</span></td><td><select onchange="upd('leads',${l.id},{status:this.value})">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k==l.status?"selected":""}>${v}</option>`).join("")}</select></td></tr>`).join("")}</table></div><h3>Покупки</h3><table>${buys.map(x=>`<tr><td>Заявка №${x.lead_id}</td><td>${x.price} ₽</td><td>${x.refunded?"возврат":`<button class="btn g s" onclick="refund(${x.id})">Вернуть</button>`}</td></tr>`).join("")}</table>`;
 if(TAB=="price")b=`<div class="card"><h3>Цена лида, ₽</h3>${(K.data||[]).map(c=>`<label class="mu">${esc(c.name)}<input type="number" value="${c.base_price}" onchange="upd('lead_categories','${c.slug}',{base_price:+this.value},'slug')"></label>`).join("")}</div>`;
 if(TAB=="pros")b=`<div class="sc"><table>${(Cn.data||[]).map(c=>`<tr><td>${esc(c.contractor_profiles?.name)}<br><span class="mu">★ ${c.rating} · баланс ${c.balance} ₽</span></td><td><button class="btn g s" onclick="upd('contractors','${c.id}',{verified:${!c.verified}},'id')">${c.verified?"Снять проверку":"Проверена"}</button><button class="btn g s" onclick="upd('contractors','${c.id}',{blocked:${!c.blocked}},'id')">${c.blocked?"Разблокировать":"Блокировать"}</button><button class="btn g s" onclick="credit('${c.id}')">Пополнить</button></td></tr>`).join("")}</table></div>`;
 if(TAB=="revs")b=`<table>${(R.data||[]).map(r=>`<tr><td>★ ${r.rating}</td><td>${esc(r.body)}</td><td><button class="btn g s" onclick="upd('reviews',${r.id},{published:${!r.published}})">${r.published?"Скрыть":"Опубликовать"}</button></td></tr>`).join("")}</table>`;
 return `<section><h1>Админ-панель</h1><div class="opt">${T.map(t=>`<button class="${TAB==t[0]?"on":""}" onclick="TAB='${t[0]}';route()">${t[1]}</button>`).join("")}</div>${b}</section>`}
async function upd(t,id,patch,col="id"){await sb.from(t).update(patch).eq(col,id);await sb.from("admin_log").insert({admin_id:ME.id,action:t+".update",payload:{id,patch}});route()}
async function refund(id){if(confirm("Сделать возврат?")){await sb.rpc("refund_lead",{p_purchase:id});route()}}
async function credit(id){const a=+prompt("Сумма пополнения, ₽");if(a>0){await sb.rpc("admin_credit",{p_contractor:id,p_amount:a});route()}}
async function route(keep){const h=location.hash.replace(/^#\/?/,"").split("?")[0].split("/"),r=h[0]||"home",a=h.slice(1);
 const V={home:()=>home(),find:()=>find(a),catalog:catalog,login:()=>login(a),cab:cab,cust:cust,admin:admin};
 if(r=="catalog"&&location.hash.includes("cat=")){C.cat=location.hash.split("cat=")[1]}
 app.innerHTML=await (V[r]||V.home)(); if(!keep)window.scrollTo(0,0)}
window.addEventListener("hashchange",()=>{step=0;err="";MSG="";route()}); init();
</script></body></html>
